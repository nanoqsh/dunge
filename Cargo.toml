[workspace]
resolver = "3"
members = [
    "dunge",
    "dunge-irgen",
    "dunge-macro",
    "dunge-shade",
    "dunge-macro-old",
    "dunge-shade-old",
    "dunge-winit",
    "examples/*",
    "helpers",
    "xtask",
]

[workspace.package]
version = "0.3.11"
edition = "2024"
license = "MIT"
authors = ["nanoqsh"]
keywords = ["graphics", "wgpu"]
documentation = "https://docs.rs/dunge"
repository = "https://github.com/nanoqsh/dunge"
rust-version = "1.94"

[workspace.dependencies]
# workspace
dunge = { version = "=0.3.11", path = "dunge" }
dunge-irgen = { version = "=0.3.11", path = "dunge-irgen" }
dunge-macro = { version = "=0.3.11", path = "dunge-macro" }
dunge-shade = { version = "=0.3.11", path = "dunge-shade" }
dunge-macro-old = { version = "=0.3.11", path = "dunge-macro-old" }
dunge-shade-old = { version = "=0.3.11", path = "dunge-shade-old" }
dunge-winit = { version = "=0.3.11", path = "dunge-winit" }
helpers.path = "helpers"
# third-party
ahash = { version = "0.8", default-features = false }
askama = { version = "0.15", default-features = false }
async-channel = "2.1"
async-executor = "1.8"
async-net = "2.0"
bytemuck = "1.13"
console_error_panic_hook = "0.1"
console_log = "1.0"
env_logger = "0.11"
futures-concurrency = "7.6"
futures-lite = "2.6"
glam = "0.32"
gloo-timers = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = "1"
log = "0.4"
naga = "29.0"
parking = "2.2"
png = "0.18"
proc-macro2 = { version = "1.0", default-features = false }
quote = "1.0"
smol-hyper = "0.1"
syn = { version = "2.0", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "29.0", default-features = false }
web-sys = "0.3"
web-time = "1.1"
winit = { version = "0.30", default-features = false }

[workspace.lints.rust]
elided-lifetimes-in-paths = "warn"
unreachable-pub = "warn"

[workspace.lints.clippy]
type-complexity = "allow"
assigning-clones = "warn"
cast-lossless = "warn"
doc-paragraphs-missing-punctuation = "warn"
explicit-iter-loop = "warn"
flat-map-option = "warn"
manual-assert = "warn"
match-wildcard-for-single-variants = "warn"
missing-assert-message = "warn"
semicolon-if-nothing-returned = "warn"
trivially-copy-pass-by-ref = "warn"
use-self = "warn"
unwrap-used = "warn"

[profile.dev]
opt-level = 1
panic = "abort"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.ci]
inherits = "dev"
opt-level = 1

[profile.ci.package."*"]
opt-level = 1

[profile.ci.build-override]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
